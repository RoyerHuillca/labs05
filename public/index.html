<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 05 - Node.js, npm y Servidor HTTP</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Laboratorio 05: Node.js, npm y Servidor HTTP</h1>
    <p>Introducción al Desarrollo Web &middot; Ingeniería de Sistemas &middot; UNSA</p>
  </header>

  <main>
    <section class="card">
      <h2>Registrar estudiante</h2>
      <form id="form-estudiante">
        <label>Nombre completo <input name="nombre" required></label>
        <label>Código <input name="codigo" required></label>
        <label>Carrera <input name="carrera" value="Ingeniería de Sistemas" required></label>
        <label>Semestre <input name="semestre" type="number" min="1" max="12"></label>
        <button type="submit">Guardar (POST)</button>
      </form>
      <p id="mensaje" role="status"></p>
    </section>

    <section class="card">
      <h2>Lista de estudiantes <small>(GET /api/estudiantes)</small></h2>
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Código</th><th>Carrera</th><th>Semestre</th></tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
